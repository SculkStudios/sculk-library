name: Canary

# Upstream breakage, found before users find it. A failure here opens an issue and never blocks a
# release: canary targets are unstable by definition.

# GitHub runs scheduled workflows from the default branch only, which is 5.x until 6.0 replaces it.
# Until then the canary also runs whenever dev changes a pinned version.
on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [dev]
    paths:
      - gradle/libs.versions.toml
      - gradle/servers.json
      - build-logic/src/main/kotlin/sculk.compatibility.gradle.kts
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  paper-api:
    name: Paper API compatibility scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Scan the pinned anchors
        run: ./gradlew :tooling:compatibility:scanPaperApi

      # Reports, never fails: a newer build is news, and the job below tells whether it breaks Sculk.
      - name: Newer server builds than the pins
        run: ./gradlew updateServerMatrix --report-only

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-api-compatibility
          path: tooling/compatibility/build/compatibility/paper-api.json

  newest-servers:
    name: Newest server builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Boot, threading and the proxy on the newest stable builds of every pinned version
        run: >-
          ./gradlew -Psculk.servers=latest
          :integration-tests:boot:verifyBoot
          :integration-tests:threading:verifyThreading
          :integration-tests:velocity:verifyVelocity

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newest-server-logs
          path: |
            integration-tests/*/build/servers/*/logs/
            integration-tests/velocity/build/proxy/logs/

  report:
    name: Report failure
    runs-on: ubuntu-latest
    needs: [paper-api, newest-servers]
    if: failure()
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Canary failed on $(date -u +%Y-%m-%d)" \
            --label canary \
            --body "The canary run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
