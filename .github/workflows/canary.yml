name: Canary

# Upstream breakage, found before users find it. A failure here opens an issue and never blocks a
# release: canary targets are unstable by definition.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  paper-api:
    name: Paper API compatibility scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Scan the pinned anchors
        run: ./gradlew :tooling:compatibility:scanPaperApi

      - name: Folia and Canvas availability
        run: |
          agent="sculk-studio-ci/6 (+https://github.com/${{ github.repository }})"
          echo "Folia versions on Fill:"
          curl -fsS -A "$agent" https://fill.papermc.io/v3/projects/folia | jq -c '.versions'
          echo "Newest Canvas build:"
          curl -fsS -A "$agent" "https://canvasmc.io/api/v2/builds?project=canvas" | jq -c 'max_by(.buildNumber) | {minecraftVersion, buildNumber, channelName}' || true

      - uses: actions/upload-artifact@v7
        with:
          name: paper-api-compatibility
          path: tooling/compatibility/build/compatibility/paper-api.json

  report:
    name: Report failure
    runs-on: ubuntu-latest
    needs: paper-api
    if: failure()
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Canary failed on $(date -u +%Y-%m-%d)" \
            --label canary \
            --body "The scheduled canary run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
