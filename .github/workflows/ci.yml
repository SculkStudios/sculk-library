name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # `build` already depends on `test` and `ktlintCheck`; running them as separate steps
      # re-ran the whole task graph three times per job.
      - name: Build
        run: ./gradlew build --no-daemon

      # The committed .api files are the public surface. A change to them has to be deliberate and
      # visible in the diff, which is the only thing that makes a stability marker mean anything.
      - name: Check public API
        run: ./gradlew apiCheck --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"
