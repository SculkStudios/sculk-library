name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # `build` already depends on `test` and `ktlintCheck`; running them as separate steps
      # re-ran the whole task graph three times per job.
      - name: Build
        run: ./gradlew build --no-daemon

      # The committed .api files are the public surface. A change to them has to be deliberate and
      # visible in the diff, which is the only thing that makes a stability marker mean anything.
      - name: Check public API
        run: ./gradlew apiCheck --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        working-directory: docs
        run: bun install --frozen-lockfile

      # The docs are a product surface and every page carries compilable snippets. Without this a
      # page referencing a deleted API stays wrong until a user finds it, which is the worst way to
      # learn that a rename was incomplete.
      - name: Build docs
        working-directory: docs
        run: bun run build
