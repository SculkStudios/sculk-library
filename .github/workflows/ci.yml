name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The last version listed becomes JAVA_HOME and runs Gradle; the build compiles on 25 and runs
      # the unit tests on both, so both must be installed.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      # Gradle only writes its cache from the default branch unless told otherwise, and 6 lives on dev.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Build, test on Java 21 and 25, check ABI, architecture and bytecode level
        run: ./gradlew build

      - name: Publish to the local repository
        run: ./gradlew publishToMavenLocal

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: "**/build/reports/"

  # One job per suite, so a failing suite never hides the others; every server is pinned in
  # gradle/servers.json.
  servers:
    name: Real servers (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      # Sixteen jobs resolving at once draw HTTP 429 from Maven Central; six at a time stays clear.
      max-parallel: 6
      matrix:
        include:
          - suite: boot
            about: Boot on every Paper anchor
            task: ":integration-tests:boot:verifyBoot"
          - suite: threading
            about: Threading on the oldest and newest Paper anchors, Folia at two region sizes, and Canvas
            task: ":integration-tests:threading:verifyThreading"
          - suite: commands
            about: Commands on the oldest and newest Paper anchors and Folia
            task: ":integration-tests:commands:verifyCommands"
          - suite: items
            about: Items on every Paper anchor, Folia and Canvas
            task: ":integration-tests:items:verifyItems"
          - suite: registry
            about: Registries on every Paper anchor, Folia and Canvas
            task: ":integration-tests:registry:verifyRegistry"
          - suite: recipes
            about: Recipes on every Paper anchor, Folia and Canvas
            task: ":integration-tests:recipes:verifyRecipes"
          - suite: client
            about: A real client joins every Paper anchor, Folia and Canvas
            task: ":integration-tests:client:verifyClient"
          - suite: menus
            about: Menus clicked by a real client on every Paper anchor, Folia and Canvas
            task: ":integration-tests:menus:verifyMenus"
          - suite: dialogs
            about: Dialogs answered by a real client on every Paper anchor, Folia and Canvas
            task: ":integration-tests:dialogs:verifyDialogs"
          - suite: hud
            about: HUD seen by a real client on every Paper anchor, Folia and Canvas
            task: ":integration-tests:hud:verifyHud"
          - suite: scenes
            about: Scenes seen by two real clients on every Paper anchor, Folia and Canvas
            task: ":integration-tests:scenes:verifyScenes"
          - suite: npcs
            about: NPCs seen and clicked by a real client on every Paper anchor, Folia and Canvas
            task: ":integration-tests:npcs:verifyNpcs"
          - suite: world
            about: Game rules and world clocks on every Paper anchor, Folia and Canvas
            task: ":integration-tests:world:verifyWorld"
          - suite: config-admin
            about: Config editor used by a real client on every Paper anchor, Folia and Canvas
            task: ":integration-tests:config-admin:verifyConfigAdmin"
          - suite: examples
            about: Example plugins on every server
            task: ":integration-tests:examples:verifyExamples"
          - suite: velocity
            about: Velocity and the network example
            task: ":integration-tests:velocity:verifyVelocity"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Only the build job saves the Gradle cache: sixteen jobs saving their own entries filled the
          # repository's cache, evicted the build job's, and sent every job to Maven Central (HTTP 429).
          cache-read-only: true

      - name: ${{ matrix.about }}
        run: ./gradlew ${{ matrix.task }}

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-logs-${{ matrix.suite }}
          path: |
            integration-tests/*/build/servers/*/logs/
            integration-tests/velocity/build/proxy/logs/
