name: CI

on:
  push:
    branches: [main, sculk-6, "release/**"]
  pull_request:
    branches: [main, sculk-6, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The last version listed becomes JAVA_HOME and runs Gradle; the build compiles on 25 and runs
      # the unit tests on both, so both must be installed.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test on Java 21 and 25, check ABI, architecture and bytecode level
        run: ./gradlew build

      - name: Publish to the local repository
        run: ./gradlew publishToMavenLocal

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: "**/build/reports/"

  boot:
    name: Boot on real servers
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Paper 1.21.4 on Java 21, Paper 26.3 on Java 25
        run: ./gradlew :integration-tests:boot:verifyBoot

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: integration-tests/*/build/servers/*/logs/
