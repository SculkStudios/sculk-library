name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The last version listed becomes JAVA_HOME and runs Gradle; the build compiles on 25 and runs
      # the unit tests on both, so both must be installed.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      # Gradle only writes its cache from the default branch unless told otherwise, and 6 lives on dev.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Build, test on Java 21 and 25, check ABI, architecture and bytecode level
        run: ./gradlew build

      - name: Publish to the local repository
        run: ./gradlew publishToMavenLocal

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: "**/build/reports/"

  servers:
    name: Real servers
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      # Gradle only writes its cache from the default branch unless told otherwise, and 6 lives on dev.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      # Every server below is pinned in gradle/servers.json.
      - name: Boot on every Paper anchor
        run: ./gradlew :integration-tests:boot:verifyBoot

      - name: Threading on the oldest and newest Paper anchors, Folia at two region sizes, and Canvas
        run: ./gradlew :integration-tests:threading:verifyThreading

      - name: Commands on the oldest and newest Paper anchors and Folia
        run: ./gradlew :integration-tests:commands:verifyCommands

      - name: Items on every Paper anchor, Folia and Canvas
        run: ./gradlew :integration-tests:items:verifyItems

      - name: Registries on every Paper anchor, Folia and Canvas
        run: ./gradlew :integration-tests:registry:verifyRegistry

      - name: Recipes on every Paper anchor, Folia and Canvas
        run: ./gradlew :integration-tests:recipes:verifyRecipes

      - name: A real client joins every Paper anchor, Folia and Canvas
        run: ./gradlew :integration-tests:client:verifyClient

      - name: Menus clicked by a real client on every Paper anchor, Folia and Canvas
        run: ./gradlew :integration-tests:menus:verifyMenus

      - name: Dialogs answered by a real client on every Paper anchor, Folia and Canvas
        run: ./gradlew :integration-tests:dialogs:verifyDialogs

      - name: Example plugins on every server
        run: ./gradlew :integration-tests:examples:verifyExamples

      - name: Velocity and the network example
        run: ./gradlew :integration-tests:velocity:verifyVelocity

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-logs
          path: |
            integration-tests/*/build/servers/*/logs/
            integration-tests/velocity/build/proxy/logs/
