name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The last version listed becomes JAVA_HOME and runs Gradle; the build compiles on 25 and runs
      # the unit tests on both, so both must be installed.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test on Java 21 and 25, check ABI, architecture and bytecode level
        run: ./gradlew build

      - name: Publish to the local repository
        run: ./gradlew publishToMavenLocal

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: "**/build/reports/"

  servers:
    name: Real servers
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Boot on Paper 1.21.4 (Java 21) and Paper 26.3 (Java 25)
        run: ./gradlew :integration-tests:boot:verifyBoot

      - name: Threading on Paper 1.21.4, Paper 26.3, Folia 26.1.2 and Canvas 26.3
        run: ./gradlew :integration-tests:threading:verifyThreading

      - name: Velocity 4.2.0
        run: ./gradlew :integration-tests:velocity:verifyVelocity

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: |
            integration-tests/*/build/servers/*/logs/
            integration-tests/velocity/build/proxy/logs/
