[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.11.0"
snakeyaml-engine = "3.2"
junit = "6.1.3"
asm = "9.11"
archunit = "1.5.1"
ktlint = "1.8.0"
ktlint-gradle = "14.2.0"
dokka = "2.2.0"
maven-publish = "0.37.0"
shadow = "9.6.1"
license-report = "3.1.4"
kotlinx-benchmark = "0.5.0"
run-paper = "3.1.0"
# Paper publishes 1.21.x APIs only as snapshots; this is the last 1.21.4 build, pinned so the floor
# cannot move under a verified build.
paper-floor = "1.21.4-R0.1-20250925.065901-231"
paper-current = "26.3.build.175-stable"
canvas = "26.3.build.978-stable"
velocity = "4.2.0"
adventure-floor = "4.20.0"
adventure-latest = "5.2.0"

[libraries]
benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinx-benchmark" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
kotlin-metadata = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }
paper-api-floor = { module = "io.papermc.paper:paper-api", version.ref = "paper-floor" }
paper-api-current = { module = "io.papermc.paper:paper-api", version.ref = "paper-current" }
canvas-api = { module = "io.canvasmc.canvas:canvas-api", version.ref = "canvas" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure-floor" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure-floor" }
adventure-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure-floor" }
adventure-latest-api = { module = "net.kyori:adventure-api", version.ref = "adventure-latest" }
adventure-latest-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure-latest" }
adventure-latest-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure-latest" }

gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-kotlin-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
gradle-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
gradle-dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
gradle-maven-publish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }
gradle-shadow = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
gradle-kotlinx-benchmark = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-plugin", version.ref = "kotlinx-benchmark" }
gradle-kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
gradle-license-report = { module = "com.github.jk1:gradle-license-report", version.ref = "license-report" }
gradle-run-task = { module = "xyz.jpenilla:run-task", version.ref = "run-paper" }
