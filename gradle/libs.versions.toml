[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
junit = "6.1.3"
asm = "9.11"
archunit = "1.5.1"
ktlint = "1.8.0"
ktlint-gradle = "14.2.0"
dokka = "2.2.0"
maven-publish = "0.37.0"
shadow = "9.6.1"
run-paper = "3.1.0"
paper-floor = "1.21.4-R0.1-SNAPSHOT"
paper-current = "26.3.build.175-stable"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
kotlin-metadata = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }
paper-api-floor = { module = "io.papermc.paper:paper-api", version.ref = "paper-floor" }
paper-api-current = { module = "io.papermc.paper:paper-api", version.ref = "paper-current" }

gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
gradle-dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
gradle-maven-publish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }
gradle-shadow = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
gradle-run-task = { module = "xyz.jpenilla:run-task", version.ref = "run-paper" }
