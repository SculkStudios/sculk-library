[versions]
kotlin            = "2.4.10"
coroutines        = "1.11.0"
serialization     = "1.11.0"
kaml              = "0.104.0"
lettuce           = "7.6.0.RELEASE"
paper             = "1.21.11-R0.1-SNAPSHOT"
adventure         = "5.2.0"
minimessage       = "5.2.0"
hikari            = "7.1.0"
caffeine          = "3.2.4"
sqlite-jdbc       = "3.53.2.1"
mariadb-jdbc      = "3.5.10"
postgresql        = "42.7.13"
snakeyaml         = "2.6"
junit             = "6.1.2"
mockito-kotlin    = "6.3.0"
mockbukkit        = "4.110.0"
asm               = "9.8"
h2                = "2.4.240"
# The ktlint CLI/engine version, distinct from the Gradle plugin that drives it.
ktlint            = "1.8.0"
ktlint-gradle     = "14.2.0"
binary-compat     = "0.18.1"
jmh               = "1.37"
jmh-plugin        = "0.7.3"
shadow            = "9.6.1"
run-paper         = "3.0.2"
packetevents      = "2.13.0"
protocollib       = "5.4.0"

[libraries]
# Coroutines
coroutines-core   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Serialization — the descriptor tree drives both the config codec and the ORM row mapping,
# which is what lets both drop kotlin-reflect entirely.
serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kaml              = { module = "com.charleskorn.kaml:kaml",              version.ref = "kaml" }

# Redis (distributed cache backend)
lettuce           = { module = "io.lettuce:lettuce-core",                version.ref = "lettuce" }

# Paper
paper-api         = { module = "io.papermc.paper:paper-api",            version.ref = "paper" }

# Adventure (bundled in Paper — compileOnly for standalone modules)
adventure-api     = { module = "net.kyori:adventure-api",               version.ref = "adventure" }
adventure-mini    = { module = "net.kyori:adventure-text-minimessage",  version.ref = "minimessage" }

# Database
hikari            = { module = "com.zaxxer:HikariCP",                   version.ref = "hikari" }
sqlite-jdbc       = { module = "org.xerial:sqlite-jdbc",                version.ref = "sqlite-jdbc" }
mariadb-jdbc      = { module = "org.mariadb.jdbc:mariadb-java-client",  version.ref = "mariadb-jdbc" }
postgresql        = { module = "org.postgresql:postgresql",             version.ref = "postgresql" }
# Speaks both the MySQL and Postgres dialects, so generated SQL is exercised by a real engine
# rather than asserted as a string.
h2                = { module = "com.h2database:h2",                     version.ref = "h2" }

# Cache
caffeine          = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

# Config
snakeyaml         = { module = "org.yaml:snakeyaml",                   version.ref = "snakeyaml" }

# Test
junit-jupiter     = { module = "org.junit.jupiter:junit-jupiter",       version.ref = "junit" }
mockito-kotlin    = { module = "org.mockito.kotlin:mockito-kotlin",     version.ref = "mockito-kotlin" }
mockbukkit        = { module = "org.mockbukkit.mockbukkit:mockbukkit-v1.21", version.ref = "mockbukkit" }
asm               = { module = "org.ow2.asm:asm",                        version.ref = "asm" }

# Packet backends (optional adapters only)
packetevents-spigot = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
protocollib         = { module = "net.dmulloy2:ProtocolLib", version.ref = "protocollib" }

# Benchmarks
jmh-core          = { module = "org.openjdk.jmh:jmh-core",             version.ref = "jmh" }
jmh-generator     = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }

# Build-logic classpath (referenced from build-logic/build.gradle.kts so versions live here only)
build-kotlin-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
build-ktlint-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle",      version.ref = "ktlint-gradle" }

[plugins]
kotlin-jvm        = { id = "org.jetbrains.kotlin.jvm",    version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint            = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
shadow            = { id = "com.gradleup.shadow",             version.ref = "shadow" }
jmh               = { id = "me.champeau.jmh",             version.ref = "jmh-plugin" }
run-paper         = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
binary-compat     = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compat" }
