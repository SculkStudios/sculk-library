# The 16-module build outgrew the JVM defaults: compiling the whole tree in one invocation started
# failing with "OutOfMemoryError: Java heap space" partway through, which reads like a broken source
# file rather than an exhausted heap and costs real time to diagnose.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx3g

org.gradle.caching=true
